name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build C API and run C tests
        run: make test
        working-directory: backend-c
      - name: Run C tests with address and undefined behavior sanitizers
        run: make sanitize
        working-directory: backend-c
      - name: Smoke test live C API
        run: python3 tests/smoke_api.py
        working-directory: backend-c
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npm run lint && npm test -- --reporter=dot && npm run build
        working-directory: frontend
